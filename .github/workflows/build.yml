name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # versionCode 取自 git 提交数，必须完整历史
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 37
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" || \
          sdkmanager --install "platforms;android-37" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 配了签名密钥就用正式签名；没配就用调试签名，保证能出包
      - name: Decode signing key
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

      - name: Build Release APK (signed)
        if: env.KEYSTORE_BASE64 != ''
        run: ./gradlew --no-daemon :app:assembleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks

      - name: Build Release APK (debug signed)
        if: env.KEYSTORE_BASE64 == ''
        run: ./gradlew --no-daemon :app:assembleRelease
        env:
          KEYSTORE_PATH: ""

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OTA-Downgrader-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
