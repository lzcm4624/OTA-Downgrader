name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # versionCode 取自 git 提交数，必须完整历史
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 运行器自带 Android SDK，但默认只有最近的稳定平台；compileSdk = 37 需要单独装
      - name: Install SDK 37
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK_ROOT=$SDK_ROOT"
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n1)"
          fi
          echo "sdkmanager=$SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-37.0" "build-tools;37.0.0"
          echo "--- installed platforms ---"
          ls "$SDK_ROOT/platforms"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 配了签名密钥就用正式签名；没配就用调试签名，保证出来的包能装
      - name: Decode signing key
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

      - name: Build Release APK (signed)
        if: env.KEYSTORE_BASE64 != ''
        run: ./gradlew --no-daemon :app:assembleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks

      - name: Build Release APK (debug signed)
        if: env.KEYSTORE_BASE64 == ''
        run: ./gradlew --no-daemon :app:assembleRelease
        env:
          KEYSTORE_PATH: ""

      - name: Rename APK
        run: |
          cd app/build/outputs/apk/release
          for f in *.apk; do
            [ -e "$f" ] || continue
            mv "$f" "OTA-Downgrader-${{ github.run_number }}.apk"
          done
          ls -l

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OTA-Downgrader-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
